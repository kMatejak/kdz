  /* WARSTWA 1: Pierwszy plan (duże płatki, szybkie, delikatny dryf w prawo) */
  html body .snow {
    background-size: 650px 650px !important;
    opacity: 0.9 !important;
    animation: lucent-snow-front 9s linear infinite !important;
  }

  /* WARSTWA 2: Środkowy plan (średnie płatki, wolniejsze, lekki dryf w lewo) */
  html body .snow::before {
    background-size: 450px 450px !important;
    background-position: 150px 80px !important;
    opacity: 0.55 !important;
    animation: lucent-snow-mid 16s linear infinite !important;
  }

  /* WARSTWA 3: Dalekie tło (drobny pył, bardzo powolny, gęstszy) */
  html body .snow::after {
    background-size: 300px 300px !important;
    background-position: -90px 210px !important;
    opacity: 0.3 !important;
    animation: lucent-snow-back 26s linear infinite !important;
  }

  /* Płynne zapętlenie dokładnie o wysokość danego kafelka + kołysanie na wietrze */
  @keyframes lucent-snow-front {
    0%   { transform: translate3d(0px, 0, 0); }
    50%  { transform: translate3d(25px, 325px, 0); }
    100% { transform: translate3d(0px, 650px, 0); }
  }

  @keyframes lucent-snow-mid {
    0%   { transform: translate3d(0px, 0, 0); }
    50%  { transform: translate3d(-20px, 225px, 0); }
    100% { transform: translate3d(0px, 450px, 0); }
  }

  @keyframes lucent-snow-back {
    0%   { transform: translate3d(0px, 0, 0); }
    50%  { transform: translate3d(12px, 150px, 0); }
    100% { transform: translate3d(0px, 300px, 0); }
  }
